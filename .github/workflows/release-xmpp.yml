name: Release XMPP templates

# Release por perfil para xat: solo los artefactos que llevan el modulo xmpp.
# Convencion de tags: vX.Y.Z-xmpp. El release generico (Odisea + TheGates) NO
# corre para estos tags (release.yml los salta en su job guard).
#
# xat consume, del release pineado en su .github/box3d_release:
#   godot.box3d.linux.x86_64.headless_xmpp
#   android_release_xmpp.apk / android_debug_xmpp.apk / android_source_xmpp.zip
#   osx_xmpp.zip / iphone_xmpp.zip
#   linux_x11_64_release_xmpp / linux_x11_64_debug_xmpp (templates Linux X11)
on:
  push:
    tags: ["v*-xmpp"]
  workflow_dispatch:
    inputs:
      tag:
        description: "XMPP release tag (for example v0.5.5-xmpp). Debe existir."
        required: true
        type: string

jobs:
  xmpp-templates:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: headless
            name: headless-xmpp
            os: ubuntu-22.04
          - target: android-templates
            name: android-xmpp
            os: ubuntu-22.04
          - target: macos-templates
            name: macos-xmpp
            os: macos-14
          - target: ios-templates
            name: ios-xmpp
            os: macos-14
          - target: linux-templates
            name: linux-xmpp
            os: ubuntu-22.04
    uses: ./.github/workflows/build-target.yml
    with:
      target: ${{ matrix.target }}
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      profile: xmpp

  publish:
    needs: xmpp-templates
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-xmpp'
          merge-multiple: false

      - name: Publish XMPP artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" == v*-xmpp ]] || { echo "::error::Expected a v*-xmpp tag, got $TAG"; exit 1; }
          test -s artifacts/headless-xmpp/godot.box3d.linux.x86_64.headless_xmpp
          test -s artifacts/android-xmpp/android_release_xmpp.apk
          test -s artifacts/android-xmpp/android_debug_xmpp.apk
          test -s artifacts/ios-xmpp/iphone_xmpp.zip
          test -s artifacts/macos-xmpp/osx_xmpp.zip
          test -s artifacts/linux-xmpp/linux_x11_64_release_xmpp
          test -s artifacts/linux-xmpp/linux_x11_64_debug_xmpp
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$TAG" \
              --notes "Opt-in XMPP templates for xat (profile: xmpp)." --prerelease
          fi
          for f in artifacts/*-xmpp/*; do
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
