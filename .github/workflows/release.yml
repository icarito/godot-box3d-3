name: Release

# Publishes the binaries a project needs to actually run on this backend: the
# editor/headless binaries and matching export templates. A custom module is
# useless to a CI that cannot compile Godot itself, which is most of them, and
# exporting with stock templates silently falls back to Bullet.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish the binaries under"
        required: true

env:
  # Keep in step with GODOT_REF in scripts/build.sh.
  GODOT_VERSION: "3.6.4.rc.custom_build"
  GODOT_DIR_REL: godot-engine

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: editor
            name: linux-editor
            os: ubuntu-22.04
          - target: headless
            name: linux-headless
            os: ubuntu-22.04
          - target: linux-templates
            name: linux-templates
            os: ubuntu-22.04
          - target: linux-arm64-templates
            name: linux-arm64-templates
            os: ubuntu-22.04-arm
          - target: windows-templates
            name: windows-templates
            os: ubuntu-22.04
          - target: html5-templates
            name: html5-templates
            os: ubuntu-22.04
          - target: android-templates
            name: android-templates
            os: ubuntu-22.04
          - target: macos-templates
            name: macos-templates
            os: macos-14
          - target: ios-templates
            name: ios-templates
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential scons pkg-config libx11-dev libxcursor-dev \
            libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev \
            libpulse-dev libudev-dev libxi-dev libxrandr-dev yasm

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install scons

      # Ubuntu's default MinGW uses the win32 thread model, whose libstdc++ has
      # no std::thread or std::mutex, so Godot's core/os/mutex.h does not
      # compile. The -posix variants are the ones that do.
      - name: Set up MinGW (POSIX threads)
        if: matrix.target == 'windows-templates'
        run: |
          sudo apt-get install -y --no-install-recommends mingw-w64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          x86_64-w64-mingw32-g++ --version | head -1

      - name: Set up Emscripten
        if: matrix.target == 'html5-templates'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.39

      - name: Set up JDK
        if: matrix.target == 'android-templates'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Runners ship the Android SDK but not its cmdline-tools on PATH, so
      # sdkmanager is only callable after this.
      - name: Set up Android SDK
        if: matrix.target == 'android-templates'
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK
        if: matrix.target == 'android-templates'
        run: |
          # Godot 3.6 pins this NDK; a different one fails the ABI checks.
          yes | sdkmanager --install "ndk;23.2.8568313" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> $GITHUB_ENV

      # Godot is rebuilt from scratch on a cold cache, which is most of the job.
      - name: Cache SCons objects
        uses: actions/cache@v4
        with:
          # Absolute: a literal ~ in SCONS_CACHE is not expanded, and scons then
          # fails outright trying to create a directory called "~".
          path: ${{ github.workspace }}/.scons_cache
          key: ${{ matrix.name }}-${{ hashFiles('box3d/**', 'patches/**', 'scripts/build.sh') }}
          restore-keys: ${{ matrix.name }}-

      - name: Build
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache
          GODOT_DIR: ${{ github.workspace }}/../${{ env.GODOT_DIR_REL }}
        run: scripts/build.sh ${{ matrix.target }}

      # Templates are renamed to the slots Godot looks for; the editor and
      # headless binaries keep descriptive names, nothing looks those up.
      - name: Collect artifacts
        env:
          BIN: ${{ github.workspace }}/../${{ env.GODOT_DIR_REL }}/bin
        run: |
          set -euo pipefail
          mkdir -p out
          case "${{ matrix.target }}" in
            editor)
              cp "$BIN/godot.x11.opt.tools.64" out/godot.box3d.linux.x86_64.editor
              ;;
            headless)
              cp "$BIN/godot_server.x11.opt.tools.64" out/godot.box3d.linux.x86_64.headless
              ;;
            linux-templates)
              cp "$BIN/godot.x11.opt.64" out/linux_x11_64_release
              cp "$BIN/godot.x11.opt.debug.64" out/linux_x11_64_debug
              ;;
            linux-arm64-templates)
              cp "$BIN/godot.x11.opt.64" out/linux_x11_arm64_release
              cp "$BIN/godot.x11.opt.debug.64" out/linux_x11_arm64_debug
              ;;
            windows-templates)
              cp "$BIN/godot.windows.opt.64.exe" out/windows_64_release.exe
              cp "$BIN/godot.windows.opt.debug.64.exe" out/windows_64_debug.exe
              ;;
            html5-templates)
              cp "$BIN/godot.javascript.opt.zip" out/webassembly_release.zip
              cp "$BIN/godot.javascript.opt.debug.zip" out/webassembly_debug.zip
              cp "$BIN/godot.javascript.opt.threads.zip" out/webassembly_threads_release.zip
              cp "$BIN/godot.javascript.opt.debug.threads.zip" out/webassembly_threads_debug.zip
              ;;
            android-templates)
              cp "$BIN/android_release.apk" out/android_release.apk
              cp "$BIN/android_debug.apk" out/android_debug.apk
              cp "$BIN/android_source.zip" out/android_source.zip
              ;;
            macos-templates)
              cp "$BIN/osx.zip" out/osx.zip
              ;;
            ios-templates)
              cp "$BIN/iphone.zip" out/iphone.zip
              ;;
          esac
          # Belt and braces: production=yes already omits them, but a stray
          # symbol table costs hundreds of megabytes on every CI download.
          case "${{ matrix.target }}" in
            windows-templates) x86_64-w64-mingw32-strip out/* || true ;;
            editor|headless|linux-templates|linux-arm64-templates) strip out/* || true ;;
          esac
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    # A platform that fails to build is simply absent from the .tpz: a partial
    # release still unblocks the ones that did build. A *cancelled* run is
    # different -- it was interrupted on purpose, usually to replace it with a
    # newer commit, and publishing whatever it had got that far overwrites the
    # release with a half-finished, out-of-date set of binaries.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # A .tpz is the archive Godot's template manager installs, and the
      # directory name inside it has to be the engine version string or the
      # editor will not find the templates.
      - name: Pack export templates
        run: |
          set -euo pipefail
          mkdir -p templates
          for d in artifacts/*-templates; do
            [ -d "$d" ] && cp -a "$d"/* templates/ || true
          done
          echo "${{ env.GODOT_VERSION }}" > templates/version.txt
          chmod +x templates/linux_x11_* templates/windows_64_* 2>/dev/null || true
          zip -r "Godot-Box3D-export-templates-${{ env.GODOT_VERSION }}.tpz" templates
          unzip -l "Godot-Box3D-export-templates-${{ env.GODOT_VERSION }}.tpz"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          # The .tpz is what a person installs through the editor. The loose
          # slots are for CI: an export job needs one or two of them, and making
          # it pull half a gigabyte of every other platform to get them is the
          # kind of thing that quietly doubles a pipeline's runtime.
          files: |
            artifacts/linux-editor/*
            artifacts/linux-headless/*
            templates/*
            *.tpz
