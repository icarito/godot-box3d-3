; Overrides de paridad para comparar el build desktop-GL contra el build ES.
;
; Fija lo que el build ES resuelve en esta máquina (medido con el probe de
; docs/desktop_parity.md, hallazgo 6). Sirve de cinturón: si alguna vez vuelve a
; divergir el reporte de features del OS (por ejemplo si se reintenta la Fase 2
; de `_check_internal_feature_support()`), la comparación ES vs desktop-GL sigue
; midiendo render y no configuración.
;
; Con la Fase 2 revertida (el build desktop-GL reporta `mobile` como el arm64)
; esto ya es redundante: la comparación da mean 0.037 / 221 px>30 sin él. Con la
; Fase 2 activa y sólo `depth/hdr` forzado daba mean 0.894 / 4895 px, porque
; seguían sin igualarse texture_array_reflections, shadows/filter_mode,
; directional_shadow/size y max_simultaneous_compiles.
;
; scripts/compare_glitch.sh lo copia al proyecto de captura como `override.cfg`
; mientras dura la corrida (PARITY_OVERRIDE=0 lo desactiva) y lo borra al salir.
; Godot carga `override.cfg` junto a project.godot
; (core/project_settings.cpp:475).

[rendering]

quality/depth/hdr=false
quality/reflections/texture_array_reflections=false
quality/reflections/high_quality_ggx=false
quality/shading/force_vertex_shading=false
quality/shadows/filter_mode=1
quality/directional_shadow/size=2048
quality/gi_probes/enabled=false
gles3/shaders/max_simultaneous_compiles=1
gles3/shaders/shader_compilation_mode=2
