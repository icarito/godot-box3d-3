; Overrides de paridad para comparar el build desktop-GL contra el build ES.
;
; El build desktop-GL compila con GLES_OVER_GL y su `_check_internal_feature_support()`
; (platform/frt/frt_godot.cc, Fase 2 de docs/desktop_parity.md) deja de reportar
; `mobile`, asi que ProjectSettings se saltea los overrides `.mobile`. El unico que
; cambia el render de forma masiva es `rendering/quality/depth/hdr`: el build ES
; resuelve false y el desktop-GL true, y con eso el juego se dibuja en un render
; target HDR (RGBA16F) distinto. Medido en CoverScene (Odisea, misma pose,
; congelada): el diff ES vs desktop-GL cae de mean 8.78 / 13479 px a
; mean 0.89 / 4895 px con solo esta linea, y el fondo (PanoramaSky) pasa de
; 0.964 a 0.305 contra los 0.308 del build ES.
;
; scripts/compare_glitch.sh copia este archivo al proyecto de captura como
; `override.cfg` mientras dura la corrida (PARITY_OVERRIDE=0 lo desactiva), y lo
; borra al terminar. Godot carga `override.cfg` junto a project.godot
; (core/project_settings.cpp:475).

[rendering]

quality/depth/hdr=false
